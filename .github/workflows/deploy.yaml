name: Deploy OXO Carriers Backend to Cloud Run

on:
  push:
    branches: [ task/ci-cd-integration ]
    # paths-ignore:
    #   - '.github/workflows/**'
  # pull_request:
  #   branches: [ develop ]
  #   types: [closed]
  #   paths-ignore:
  #     - '.github/workflows/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: oxo-carriers-backend
  REGION: us-central1
  AR_HOSTNAME: us-central1-docker.pkg.dev
  REPOSITORY: cgp-repo

jobs:
  build-and-test:
    # if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.STORE_PATH }}
            ~/.cache/Cypress
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        # run: pnpm install --frozen-lockfile
        run: pnpm install

#      - name: Run Linter
#        run: pnpm run lint --if-present

      - name: Run Tests
        run: pnpm test --if-present

      - name: Build Application
        run: pnpm run build

  deploy-to-cloud-run:
    # if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $AR_HOSTNAME --quiet

      - name: Get Application Version
        id: application-version
        run: |
          # Extract version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ steps.application-version.outputs.version }} \
            -t $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:latest \
            .

      - name: Push to Artifact Registry
        run: |
          docker push $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ steps.application-version.outputs.version }}
          docker push $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:latest

      - name: Validate required secrets
        env:
          CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          KC_URL: ${{ secrets.KC_URL }}
          KC_REALM: ${{ secrets.KC_REALM }}
          KC_BACKEND_CLIENT_ID: ${{ secrets.KC_BACKEND_CLIENT_ID }}
          KC_BACKEND_CLIENT_SECRET: ${{ secrets.KC_BACKEND_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
          SALARY_ENCRYPTION_KEY: ${{ secrets.SALARY_ENCRYPTION_KEY }}
          COMMUNICATIONS_DOCUMENT_FIELDS: ${{ secrets.COMMUNICATIONS_DOCUMENT_FIELDS }}
        run: |
          set -euo pipefail

          required_vars=(
            CLOUD_SQL_CONNECTION_NAME
            DB_USER
            DB_PASSWORD
            DB_NAME
            DB_SCHEMA
            KC_URL
            KC_REALM
            KC_BACKEND_CLIENT_ID
            KC_BACKEND_CLIENT_SECRET
            SMTP_HOST
            SMTP_PORT
            SMTP_SECURE
            SMTP_USER
            SMTP_PASS
            JWT_SECRET
            JWT_EXPIRES_IN
            PII_ENCRYPTION_KEY
            SALARY_ENCRYPTION_KEY
            COMMUNICATIONS_DOCUMENT_FIELDS
          )

          missing=0
          for var in "${required_vars[@]}"; do
            value="${!var:-}"
            if [ -z "$(echo "$value" | tr -d '[:space:]')" ]; then
              echo "::error::Required secret/env '$var' is missing or empty"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are empty. Fix repo secrets and re-run workflow."
            exit 1
          fi

      # ──────────────────────────────────────────────────────────────────────
      # REQUIRED GitHub Actions secrets (Settings → Secrets → Actions).
      # These MUST be set to non-empty values before deployment:
      #   GCP_PROJECT_ID, GCP_SA_KEY, CLOUD_SQL_CONNECTION_NAME,
      #   DB_USER, DB_PASSWORD, DB_NAME, DB_SCHEMA,
      #   KC_URL, KC_REALM, KC_BACKEND_CLIENT_ID, KC_BACKEND_CLIENT_SECRET
      # DB_PASSWORD must match the Cloud SQL user's password (SCRAM auth).
      # ──────────────────────────────────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        env:
          SMTP_FROM_VAL: ${{ secrets.SMTP_FROM }}
        run: |
          # --service-account=${{ secrets.GCP_SA_EMAIL }} \
          # Deploy the service with Cloud SQL configuration
          # The service account has access to Cloud SQL, so we use CLOUD_SQL_CONNECTION_NAME
          # instead of individual DB_HOST/DB_PORT/DB_PASSWORD variables
          #
          # NOTE: KC_AUDIENCE is intentionally NOT passed. Audience validation is
          # disabled because Keycloak tokens don't include the backend client id in
          # `aud` unless an audience mapper is configured, which otherwise 401s every
          # valid token. To re-enable, set the KC_AUDIENCE secret and re-add:
          #   --set-env-vars="KC_AUDIENCE=${{ secrets.KC_AUDIENCE }}" \
          gcloud run deploy $SERVICE_NAME \
            --image=$AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ steps.application-version.outputs.version }} \
            --region=$REGION \
            --platform=managed \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --allow-unauthenticated \
            --memory=1Gi \
            --cpu=1 \
            --port=5000 \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }}" \
            --set-env-vars="DB_USER=${{ secrets.DB_USER }}" \
            --set-env-vars="DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars="DB_NAME=${{ secrets.DB_NAME }}" \
            --set-env-vars="DB_SCHEMA=${{ secrets.DB_SCHEMA }}" \
            --set-env-vars="FRONTEND_URL=${{ secrets.FRONTEND_URL }}" \
            --set-env-vars="SMTP_HOST=${{ secrets.SMTP_HOST }}" \
            --set-env-vars="SMTP_PORT=${{ secrets.SMTP_PORT }}" \
            --set-env-vars="SMTP_SECURE=${{ secrets.SMTP_SECURE }}" \
            --set-env-vars="SMTP_USER=${{ secrets.SMTP_USER }}" \
            --set-env-vars="SMTP_PASS=${{ secrets.SMTP_PASS }}" \
            --set-env-vars="SMTP_FROM=${SMTP_FROM_VAL}" \
            --set-env-vars="KC_URL=${{ secrets.KC_URL }}" \
            --set-env-vars="KC_REALM=${{ secrets.KC_REALM }}" \
            --set-env-vars="KC_BACKEND_CLIENT_ID=${{ secrets.KC_BACKEND_CLIENT_ID }}" \
            --set-env-vars="KC_BACKEND_CLIENT_SECRET=${{ secrets.KC_BACKEND_CLIENT_SECRET }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}" \
            --set-env-vars="PII_ENCRYPTION_KEY=${{ secrets.PII_ENCRYPTION_KEY }}" \
            --set-env-vars="SALARY_ENCRYPTION_KEY=${{ secrets.SALARY_ENCRYPTION_KEY }}" \
            --set-env-vars="COMMUNICATIONS_DOCUMENT_FIELDS=${{ secrets.COMMUNICATIONS_DOCUMENT_FIELDS }}" \
            --revision-suffix=${{ github.sha }}-${{ github.run_attempt }} \
            --labels="commit=${{ github.sha }},branch=develop,app=oxo-carriers-backend" \
            --quiet

          # Get service URL
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region=$REGION \
            --format='value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "service_name=$SERVICE_NAME" >> $GITHUB_OUTPUT

      - name: Show Deployment Info
        run: |
          echo "Deployment Successful!"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "Image: $AR_HOSTNAME/$PROJECT_ID/$REPOSITORY/$SERVICE_NAME:${{ steps.application-version.outputs.version }}"
